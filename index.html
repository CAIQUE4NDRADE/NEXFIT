  <meta property="og:site_name" content="NEXFIT">
  <meta property="og:title" content="NEXFIT · Treine. Acompanhe. Evolua.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NEXFIT">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/screens.css">
  <link rel="stylesheet" href="./css/premium.css">
  <script>
    // aplica tema e tamanho da letra antes de desenhar (evita "piscar")
    try {
      var s = JSON.parse(localStorage.getItem('nexfitV3') || 'null');
      var p = (s && s.prefs) || {};
      document.documentElement.dataset.theme = p.temaEscolhido ? (p.tema || 'dark') : 'dark';
      document.documentElement.style.setProperty('--scale', p.letra || 1);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="shell">
    <div style="display:grid;place-items:center;min-height:100dvh;font-family:system-ui;color:#4B5563">Carregando o NEXFIT…</div>
  </div>
  <noscript><p style="padding:24px">O NEXFIT precisa do JavaScript ligado no navegador.</p></noscript>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script type="module">
    import { start } from './js/app.js';
    start();
  </script>
</body>
</html>
